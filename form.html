<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Review Form - WDD 131 - William Michel Borja Ornelas</title>
  <meta name="description" content="WDD 131 W05 product review form with a dynamic product list, star rating, installation date and useful features.">
  <meta name="author" content="William Michel Borja Ornelas">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto+Slab:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>

<body>
  <header>
    <h1>Product Review</h1>
    <p>Tell us how your product is working for you.</p>
  </header>

  <main>
    <form action="review.html" method="get" class="review-form">

      <label for="product">Product Name</label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <fieldset class="rating">
        <legend>Overall Rating</legend>
        <div class="stars">
          <input type="radio" id="rating5" name="rating" value="5" required>
        <label for="rating5" title="5 stars">&star;</label>
        <input type="radio" id="rating4" name="rating" value="4" required>
        <label for="rating4" title="4 stars">&star;</label>
        <input type="radio" id="rating3" name="rating" value="3" required>
        <label for="rating3" title="3 stars">&star;</label>
        <input type="radio" id="rating2" name="rating" value="2" required>
        <label for="rating2" title="2 stars">&star;</label>
        <input type="radio" id="rating1" name="rating" value="1" required>
        <label for="rating1" title="1 star">&star;</label>
        </div>
      </fieldset>

      <label for="installDate">Date of Installation</label>
      <input type="date" id="installDate" name="installDate" required>

      <fieldset class="features">
        <legend>Useful Features <span>(check all that apply)</span></legend>
        <input type="checkbox" id="durability" name="features" value="durability">
        <label for="durability">Durability</label>
        <input type="checkbox" id="easyToUse" name="features" value="easy to use">
        <label for="easyToUse">Easy to use</label>
        <input type="checkbox" id="performance" name="features" value="performance">
        <label for="performance">Performance</label>
        <input type="checkbox" id="design" name="features" value="design">
        <label for="design">Design</label>
      </fieldset>

      <label for="writtenReview">Written Review <span>(optional)</span></label>
      <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>

      <label for="userName">User Name <span>(optional)</span></label>
      <input type="text" id="userName" name="userName" autocomplete="name">

      <input type="submit" value="Post Review">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> William Michel Borja Ornelas, Michoacan, Mexico</p>
    <p id="lastModified"></p>
  </footer>
</body>

</html>
